# Führt bei jedem Push die Test-Suite, den Browser-Smoke-Test und den Paketbau aus.
# Ergebnis erscheint als grüner Haken bzw. rotes Kreuz neben dem Commit
# auf github.com – die Regel "vor dem Push muss die Suite grün sein" hängt
# damit nicht mehr allein an Disziplin.
name: Prüfung und Paket

on:
  push:
  pull_request:
  workflow_dispatch: # erlaubt manuelles Starten über die GitHub-Oberfläche

# Grundrecht für alle Jobs: nur lesen. Der Release-Job unten hebt das für
# sich auf contents: write an. Ohne diesen Block warnt CodeQL (CWE-275),
# weil das Token sonst mehr darf, als die Jobs brauchen.
permissions:
  contents: read

# Test-Abhängigkeiten festgenagelt: ein neues Release von jsdom, Playwright
# oder Selenium darf die Tests nicht ohne eigene Änderung rot färben, und in
# der CI läuft genau die Version, die lokal geprüft wurde (STARTPROMPT.md
# nennt dieselben). Neue Versionen bewusst hier hochsetzen.
env:
  JSDOM: jsdom@30.1.0
  PLAYWRIGHT: playwright@1.56.1
  SELENIUM: selenium-webdriver@4.49.0

jobs:
  # Pflichtlauf: ohne Fixtures, damit das Ergebnis nicht von der
  # Erreichbarkeit von bger.ch abhängt. Deckt alle Blöcke ausser [3] (echte Entscheidseiten) ab.
  suite:
    name: Test-Suite (ohne Fixtures)
    runs-on: ubuntu-latest
    steps:
      # v5 ist die erste Version, die auf Node 24 läuft; v4 löst auf den
      # Runnern eine Deprecation-Warnung aus. Node 22 = aktuelles LTS.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: jsdom installieren (einzige Abhängigkeit der Suite)
        working-directory: test
        run: npm install --no-save --no-audit --no-fund "$JSDOM"

      - name: Syntaxprüfung des ausgelieferten Skripts
        run: node --check extension/content.js

      - name: Manifest ist gültiges JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

      - name: Test-Suite
        run: node test/test-runner.js

      - name: Paket baut und bleibt unter der Groessengrenze
        run: bash tools/release.sh

  # Zusatzlauf: mit echten Entscheidseiten. Schlägt fehl, sobald bger.ch nicht
  # erreichbar ist oder sein HTML ändert – das ist wertvolle Information, darf
  # aber den Pflichtlauf nicht blockieren, deshalb continue-on-error.
  suite-fixtures:
    name: Test-Suite (mit echten Entscheidseiten, nicht blockierend)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: jsdom installieren
        working-directory: test
        run: npm install --no-save --no-audit --no-fund "$JSDOM"

      - name: Fixtures laden
        run: bash tools/fetch-fixtures.sh

      - name: Test-Suite mit Fixtures
        run: node test/test-runner.js

      # Klammer-Report: jede Klammer der echten Entscheidseiten mit der
      # Entscheidung der Heuristik. Liegt nach dem Lauf unter "Artifacts"
      # zum Herunterladen und steht vollständig im Job-Log – die Prüfung an
      # echtem Text.
      - name: Klammer-Report erzeugen
        run: node tools/klammern-report.js | tee klammern-report.txt

      - uses: actions/upload-artifact@v6
        with:
          name: klammern-report
          path: klammern-report.txt
          retention-days: 30

  # Browser-Smoke-Test: die fertige Extension in echten Browsern, auf Windows
  # und Linux. test/browser-umgebung.js beschreibt den Aufbau (Seiten lokal
  # ausgeliefert wegen des Bot-Schutzes von bger.ch), test/browser-smoke.js,
  # was geprüft wird. Chromium über Playwright (steht auch für Chrome und
  # Brave), Edge = das auf den Runnern installierte Microsoft Edge, Firefox
  # über Selenium mit dem vorinstallierten Firefox und geckodriver.
  # Danach tools/screenshots.js: die Bilder für Store und Doku, als Artefakt
  # "screenshots-<os>-<browser>" (Windows-Bilder für den Store nehmen).
  # Die Smoke-Screenshots liegen unter "smoke-<os>-<browser>".
  smoke:
    name: Browser-Smoke-Test (${{ matrix.browser }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        browser: [chromium, edge, firefox]
    # Auch auf Windows in bash (Git for Windows): PowerShell kennt "$JSDOM"
    # als Umgebungsvariable nicht, die Installationsschritte liefen dort leer.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Fixtures zwischenspeichern: nach dem ersten Lauf hängt der Job nicht
      # mehr an der Erreichbarkeit von bger.ch, und die Site wird geschont.
      # Neuer Schlüssel, sobald sich die Fixture-Liste ändert.
      - uses: actions/cache@v4
        with:
          path: test/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('tools/fetch-fixtures.sh') }}

      - name: Fixtures laden (Seiten und Site-CSS, übersprungen wenn vorhanden)
        run: bash tools/fetch-fixtures.sh

      - name: Playwright installieren (Chromium und Edge)
        if: matrix.browser != 'firefox'
        working-directory: test
        run: npm install --no-save --no-audit --no-fund "$PLAYWRIGHT"

      - name: Chromium herunterladen (Edge ist auf den Runnern installiert)
        if: matrix.browser == 'chromium'
        working-directory: test
        run: npx playwright install chromium

      - name: Selenium installieren
        if: matrix.browser == 'firefox'
        working-directory: test
        run: npm install --no-save --no-audit --no-fund "$SELENIUM"

      - name: Smoke-Test
        run: node test/browser-smoke.js ${{ matrix.browser }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.browser }}
          path: test/smoke/
          retention-days: 30

      # Bilder für Store und Doku. Kein Release-Gate: ein fehlendes Bild darf
      # kein Release blockieren (continue-on-error), es fehlt dann im Artefakt.
      - name: Screenshots für Store und Doku
        continue-on-error: true
        run: node tools/screenshots.js ${{ matrix.browser }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: test/screenshots/
          retention-days: 90

  # Paket veröffentlichen: nach jedem Push auf main, aber nur wenn Suite und
  # Smoke-Test grün sind und die Version im Manifest noch kein Release hat.
  # Ergebnis: github.com/<repo>/releases mit bger-reader-<version>.zip und
  # der Prüfsumme als Anhang – ein fester Download-Ort, an dem jede Datei
  # ihre Version im Namen trägt. Das Release-Tag (v0.9.2) markiert zugleich
  # den Commit.
  release:
    name: Paket als GitHub-Release veröffentlichen
    needs: [suite, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Das ZIP entsteht direkt aus dem Commit (git archive): reproduzierbar –
      # gleicher Commit, gleiche Bytes, gleiche Prüfsumme, auch lokal
      # nachbaubar – und ohne npm-Installation in dem einzigen Job, der
      # Schreibrechte hat. Ein manipuliertes Paket aus npm käme hier also
      # nicht ins Release. Die Tests liefen davor in "suite" und "smoke"
      # auf genau diesem Commit. Node ist auf dem Runner vorinstalliert.
      - name: Paket aus dem Commit bauen, Prüfsumme bilden, Grösse prüfen
        run: |
          VERSION="$(node tools/version.js)"
          DATEI="dist/bger-reader-$VERSION.zip"
          mkdir -p dist
          # --mtime: für einen Teilbaum (HEAD:extension) nähme git archive sonst
          # die aktuelle Uhrzeit, und gleiche Commits ergäben verschiedene Bytes.
          git archive --format=zip --mtime="$(git log -1 --format=%cI HEAD)" -o "$DATEI" HEAD:extension
          ( cd dist && sha256sum "bger-reader-$VERSION.zip" > "bger-reader-$VERSION.zip.sha256" )
          cat "$DATEI.sha256"
          KB=$(( ($(stat -c%s "$DATEI") + 1023) / 1024 ))
          echo "Groesse: $KB KB (erlaubt: 1023 KB)"
          test "$KB" -le 1023

      - name: Release anlegen, falls die Version neu ist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node tools/version.js)"
          TAG="v$VERSION"
          DATEI="dist/bger-reader-$VERSION.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – nichts zu tun."
            exit 0
          fi
          # Release-Notizen = der Abschnitt dieser Version aus CHANGELOG.md, dazu die Prüfsumme
          NOTIZEN="$(awk -v kopf="## $VERSION " 'index($0, kopf) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md)"
          SUMME="$(cut -d' ' -f1 "$DATEI.sha256")"
          gh release create "$TAG" "$DATEI" "$DATEI.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BGer Reader $VERSION" \
            --notes "${NOTIZEN:-Siehe CHANGELOG.md.}

          SHA-256 von bger-reader-$VERSION.zip: \`$SUMME\`"
          echo "Release $TAG angelegt: $DATEI"
