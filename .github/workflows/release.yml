# Führt bei jedem Pull Request und bei jedem Push auf main die Test-Suite, den
# Browser-Smoke-Test und den Paketbau aus. Ergebnis erscheint als grüner Haken
# bzw. rotes Kreuz neben dem Commit auf github.com – die Regel "vor dem Push
# muss die Suite grün sein" hängt damit nicht mehr allein an Disziplin.
name: Prüfung und Paket

on:
  push:
    branches: [main] # Arbeitsbranches laufen über ihren Pull Request, nicht doppelt
  pull_request:
  workflow_dispatch: # erlaubt manuelles Starten über die GitHub-Oberfläche

# Überholte Läufe desselben Branches abbrechen (schneller Folge-Push). Auf main
# nie: dort hängt das Release am Lauf.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Grundrecht für alle Jobs: nur lesen. Der Release-Job unten hebt das für
# sich auf contents: write an. Ohne diesen Block warnt CodeQL (CWE-275),
# weil das Token sonst mehr darf, als die Jobs brauchen.
permissions:
  contents: read

# Test-Abhängigkeiten (jsdom, Playwright, Selenium) stehen exakt gepinnt in
# test/package.json; package-lock.json fixiert auch alle indirekten Pakete samt
# Prüfsummen, und `npm ci` installiert genau diesen Stand – ein neues Release
# eines Pakets kann die Tests nicht ohne eigene Änderung rot färben, und in der
# CI läuft dieselbe Version wie lokal. Die Actions unten sind per Commit-Hash
# gepinnt (ein Tag lässt sich verschieben, ein Hash nicht; der Release-Job hat
# Schreibrechte und erzeugt die Store-Pakete). Updates für beides schlägt
# Dependabot monatlich als Pull Request vor (.github/dependabot.yml).

jobs:
  # Pflichtlauf ohne Fixtures: deckt alle Blöcke ausser [3] (echte Entscheidseiten) ab.
  suite:
    name: Test-Suite (ohne Fixtures)
    runs-on: ubuntu-latest
    steps:
      # checkout v5 / setup-node v5 sind die ersten Versionen, die auf Node 24
      # laufen (v4 löste auf den Runnern eine Deprecation-Warnung aus).
      # Node 22 = aktuelles LTS.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Test-Abhängigkeiten installieren (npm ci, Lockfile)
        working-directory: test
        run: npm ci --no-audit --no-fund

      - name: Syntaxprüfung der ausgelieferten Skripte
        run: for f in extension/sprachen.js extension/content.js extension/popup.js extension/background.js; do node --check "$f"; done

      - name: Manifest ist gültiges JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

      - name: Test-Suite
        run: node test/test-runner.js

      - name: Paket baut und bleibt unter der Groessengrenze
        run: bash tools/release.sh

  # Lauf mit echten Entscheidseiten: Block [3] samt Klammer-Baseline
  # (test/klammern-baseline.json) – die Prüfung, ob die Heuristik auf echtem
  # Text noch dieselben Klammern einklappt. Blockierend. Die Fixtures liegen
  # im Cache (gleicher Schlüssel wie im Smoke-Test, wird geteilt), der Lauf
  # hängt also nur beim ersten Mal an der Erreichbarkeit von bger.ch; ändert
  # sich die Fixture-Liste, holt ein neuer Schlüssel die Seiten neu.
  suite-fixtures:
    name: Test-Suite (mit echten Entscheidseiten, Klammer-Baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/package-lock.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: test/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('tools/fetch-fixtures.sh') }}

      - name: Fixtures laden (Seiten und Site-CSS, übersprungen wenn vorhanden)
        run: bash tools/fetch-fixtures.sh

      - name: Test-Abhängigkeiten installieren (npm ci, Lockfile)
        working-directory: test
        run: npm ci --no-audit --no-fund

      - name: Test-Suite mit Fixtures (Block [3] und Klammer-Baseline)
        run: node test/test-runner.js

      # Klammer-Report: jede Klammer der echten Entscheidseiten mit der
      # Entscheidung der Heuristik. Liegt nach dem Lauf unter "Artifacts"
      # zum Herunterladen und steht vollständig im Job-Log – die Prüfung an
      # echtem Text zum Nachlesen; die Baseline oben ist die automatische.
      - name: Klammer-Report erzeugen
        run: node tools/klammern-report.js | tee klammern-report.txt

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: klammern-report
          path: klammern-report.txt
          retention-days: 30

  # Browser-Smoke-Test: die fertige Extension in echten Browsern, auf Windows
  # und Linux. test/browser-umgebung.js beschreibt den Aufbau (Seiten lokal
  # ausgeliefert wegen des Bot-Schutzes von bger.ch), test/browser-smoke.js,
  # was geprüft wird. Chromium über Playwright (steht auch für Chrome und
  # Brave), Edge = das auf den Runnern installierte Microsoft Edge, Firefox
  # über Selenium mit dem vorinstallierten Firefox und geckodriver.
  # Danach tools/screenshots.js: die Bilder für Store und Doku, als Artefakt
  # "screenshots-<os>-<browser>" (Windows-Bilder für den Store nehmen).
  # Die Smoke-Screenshots liegen unter "smoke-<os>-<browser>".
  smoke:
    name: Browser-Smoke-Test (${{ matrix.browser }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        browser: [chromium, edge, firefox]
    # Auch auf Windows in bash (Git for Windows): gleiche Befehle wie auf Linux.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/package-lock.json

      # Fixtures zwischenspeichern: nach dem ersten Lauf hängt der Job nicht
      # mehr an der Erreichbarkeit von bger.ch, und die Site wird geschont.
      # Neuer Schlüssel, sobald sich die Fixture-Liste ändert.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: test/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('tools/fetch-fixtures.sh') }}

      - name: Fixtures laden (Seiten und Site-CSS, übersprungen wenn vorhanden)
        run: bash tools/fetch-fixtures.sh

      # Playwright (Chromium, Edge) und Selenium (Firefox) kommen zusammen aus
      # dem Lockfile; Browser lädt das nicht (nur der nächste Schritt).
      - name: Test-Abhängigkeiten installieren (npm ci, Lockfile)
        working-directory: test
        run: npm ci --no-audit --no-fund

      - name: Chromium herunterladen (Edge ist auf den Runnern installiert)
        if: matrix.browser == 'chromium'
        working-directory: test
        run: npx playwright install chromium

      - name: Smoke-Test
        run: node test/browser-smoke.js ${{ matrix.browser }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.browser }}
          path: test/smoke/
          retention-days: 30

      # Bilder für Store und Doku. Kein Release-Gate: ein fehlendes Bild darf
      # kein Release blockieren (continue-on-error), es fehlt dann im Artefakt.
      - name: Screenshots für Store und Doku
        continue-on-error: true
        run: node tools/screenshots.js ${{ matrix.browser }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: test/screenshots/
          retention-days: 90

  # Paket veröffentlichen: nach jedem Push auf main, aber nur wenn beide
  # Suite-Läufe und der Smoke-Test grün sind und die Version im Manifest noch
  # kein Release hat. Ergebnis: github.com/<repo>/releases mit
  # bger-reader-<version>.zip und der Prüfsumme als Anhang – ein fester
  # Download-Ort, an dem jede Datei ihre Version im Namen trägt. Das
  # Release-Tag (v0.9.2) markiert zugleich den Commit.
  release:
    name: Paket als GitHub-Release veröffentlichen
    needs: [suite, suite-fixtures, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Das ZIP entsteht direkt aus dem Commit (git archive): reproduzierbar –
      # gleicher Commit, gleiche Bytes, gleiche Prüfsumme, auch lokal
      # nachbaubar – und ohne npm-Installation in dem einzigen Job, der
      # Schreibrechte hat. Ein manipuliertes Paket aus npm käme hier also
      # nicht ins Release. Die Tests liefen davor in "suite", "suite-fixtures"
      # und "smoke" auf genau diesem Commit. Node ist auf dem Runner vorinstalliert.
      - name: Paket aus dem Commit bauen, Prüfsumme bilden, Grösse prüfen
        run: |
          VERSION="$(node tools/version.js)"
          DATEI="dist/bger-reader-$VERSION.zip"
          mkdir -p dist
          # --mtime: für einen Teilbaum (HEAD:extension) nähme git archive sonst
          # die aktuelle Uhrzeit, und gleiche Commits ergäben verschiedene Bytes.
          git archive --format=zip --mtime="$(git log -1 --format=%cI HEAD)" -o "$DATEI" HEAD:extension
          ( cd dist && sha256sum "bger-reader-$VERSION.zip" > "bger-reader-$VERSION.zip.sha256" )
          cat "$DATEI.sha256"
          KB=$(( ($(stat -c%s "$DATEI") + 1023) / 1024 ))
          echo "Groesse: $KB KB (erlaubt: 1023 KB)"
          test "$KB" -le 1023

      - name: Release anlegen, falls die Version neu ist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node tools/version.js)"
          TAG="v$VERSION"
          DATEI="dist/bger-reader-$VERSION.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – nichts zu tun."
            exit 0
          fi
          # Release-Notizen = der Abschnitt dieser Version aus CHANGELOG.md, dazu die Prüfsumme
          NOTIZEN="$(awk -v kopf="## $VERSION " 'index($0, kopf) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md)"
          SUMME="$(cut -d' ' -f1 "$DATEI.sha256")"
          gh release create "$TAG" "$DATEI" "$DATEI.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BGer Reader $VERSION" \
            --notes "${NOTIZEN:-Siehe CHANGELOG.md.}

          SHA-256 von bger-reader-$VERSION.zip: \`$SUMME\`"
          echo "Release $TAG angelegt: $DATEI"

      # Paket für Microsoft Edge Add-ons: das Hauptpaket ohne die zwei Firefox-
      # Schlüssel des Manifests (Partner Center lehnt background.scripts in
      # Manifest V3 ab; tools/edge-paket.js). Quelle ist bewusst der Anhang des
      # Releases, nicht der aktuelle Commit: so gehört das Edge-Paket immer zu
      # genau dem Hauptpaket, das im Release liegt – auch nachträglich für ein
      # Release, das ohne Edge-Paket entstand. Ist es schon unverändert dort,
      # passiert nichts.
      - name: Edge-Paket aus dem Release-Anhang bauen und anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node tools/version.js)"
          TAG="v$VERSION"
          HAUPT="bger-reader-$VERSION.zip"
          EDGE="bger-reader-$VERSION-edge.zip"
          mkdir -p /tmp/release
          ( cd /tmp/release && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$HAUPT" --pattern "$HAUPT.sha256" --clobber && sha256sum -c "$HAUPT.sha256" )
          node tools/edge-paket.js --quelle "/tmp/release/$HAUPT"
          NEU="$(cut -d' ' -f1 "/tmp/release/$EDGE.sha256")"
          VORHANDEN="$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EDGE.sha256" --output - 2>/dev/null | cut -d' ' -f1 || true)"
          if [ "$VORHANDEN" = "$NEU" ]; then
            echo "Edge-Paket liegt unverändert am Release ($NEU) – nichts zu tun."
            exit 0
          fi
          gh release upload "$TAG" "/tmp/release/$EDGE" "/tmp/release/$EDGE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Edge-Paket angehängt: $EDGE (SHA-256 $NEU)"

      # Zweiter Anhang: Bilder und Texte zum Einfügen in die Store-Dashboards
      # (store/assets-paket.js, nur Node und zip). Läuft auch, wenn das Release
      # schon bestand – --clobber ersetzt eine ältere Datei gleichen Namens.
      - name: Store-Assets an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node tools/version.js)"
          node store/assets-paket.js
          gh release upload "v$VERSION" "dist/store-assets-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --clobber
