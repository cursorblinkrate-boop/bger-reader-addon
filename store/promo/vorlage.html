<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo-Vorlage</title>
<!--
  Vorlage für die Promo-Bilder der Stores, gerendert von render.js (Playwright,
  Chromium). Eine Datei, drei Formate, gewählt über den URL-Hash:
    #klein    440 x 280   Chrome Web Store „kleine Promo-Kachel" (Pflicht), Edge optional
    #marquee  1400 x 560  Chrome Web Store „Marquee" (Voraussetzung fürs Featuring), Edge optional
    #logo     300 x 300   Edge Add-ons „Store-Logo"
  Gestaltung: Palette „Klar" des Panels (extension/content.js, panelCss): Pflaume
  #16141a, weiche Rosé-Fläche #3a2f38, Neon-Pink #ff4fa3, Rosé #ff6fa5; Marken-Icon
  ICON_MARKE (pinkes Buch); Schrift Atkinson Hyperlegible Next aus extension/fonts.
  Text: der Name der Erweiterung und die beiden Seiten, sonst nichts (Store-Regel
  Chrome: wenig Text, gesättigte Farben, kein Screenshot).
-->
<style>
  @font-face {
    font-family: "Atkinson Hyperlegible Next";
    src: url("../../extension/fonts/atkinson-hyperlegible-next-latin-400.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Atkinson Hyperlegible Next";
    src: url("../../extension/fonts/atkinson-hyperlegible-next-latin-700.woff2") format("woff2");
    font-weight: 700;
  }
  html, body { margin: 0; padding: 0; background: #16141a; }
  body {
    font-family: "Atkinson Hyperlegible Next", "Segoe UI", Arial, sans-serif;
    color: #f2ecf0;
    -webkit-font-smoothing: antialiased;
  }
  .kachel {
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #16141a;
    background-image:
      radial-gradient(ellipse at 18% 40%, #4a3446 0, rgba(58, 47, 56, 0) 55%),
      radial-gradient(ellipse at 85% 90%, rgba(255, 79, 163, .28) 0, rgba(255, 79, 163, 0) 45%);
  }
  .kachel::after {
    /* Neon-Rand wie am Panel */
    content: "";
    position: absolute;
    inset: 0;
    border: 3px solid #ff4fa3;
    pointer-events: none;
  }
  .buch { display: block; flex: none; }
  .text { display: flex; flex-direction: column; justify-content: center; }
  .marke { font-weight: 700; line-height: 1.05; color: #ffffff; }
  .claim { font-weight: 700; color: #ff6fa5; line-height: 1.1; letter-spacing: .03em; }

  /* 440 x 280 */
  .klein { width: 440px; height: 280px; gap: 26px; padding: 0 26px; }
  .klein .buch { width: 124px; height: 124px; }
  .klein .marke { font-size: 30px; }
  .klein .claim { font-size: 19px; margin-top: 12px; }

  /* 1400 x 560 */
  .marquee { width: 1400px; height: 560px; gap: 80px; padding: 0 80px; }
  .marquee .buch { width: 270px; height: 270px; }
  .marquee .marke { font-size: 82px; }
  .marquee .claim { font-size: 46px; margin-top: 26px; }

  /* 300 x 300: nur das Buch */
  .logo { width: 300px; height: 300px; }
  .logo .buch { width: 208px; height: 208px; }
  .logo .text { display: none; }
  .logo::after { border: none; }
</style>
</head>
<body>
<div class="kachel klein" id="kachel">
  <!-- ICON_MARKE aus content.js: pinkes Buch mit Smiley -->
  <svg class="buch" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <path d="M2 1h5.6v14H2a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 2 1z" fill="#d63384"/>
    <path d="M8.4 1H14a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 14 15H8.4z" fill="#e64980"/>
    <path d="M7.6 1h.8v14h-.8z" fill="#a61e63"/>
    <circle cx="4.4" cy="5.8" r="1" fill="#fff"/><circle cx="11.6" cy="5.8" r="1" fill="#fff"/>
    <path d="M3.6 9c1.4 1.8 7.4 1.8 8.8 0" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M2.2 12.6h11.6" stroke="#fff" stroke-width=".7" opacity=".7"/>
  </svg>
  <div class="text">
    <div class="marke">accessibility<br>add-on</div>
    <div class="claim">bger.ch · bvger.ch</div>
  </div>
</div>
<script>
  (function () {
    function anwenden() {
      var hash = (location.hash || '#klein').slice(1);
      document.getElementById('kachel').className = 'kachel ' + (hash || 'klein');
      document.title = 'Promo ' + hash;
    }
    anwenden();
    // Ein reiner Hash-Wechsel lädt die Seite nicht neu (auch nicht bei page.goto):
    window.addEventListener('hashchange', anwenden);
  })();
</script>
</body>
</html>
